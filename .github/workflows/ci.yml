name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check Rust project
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt -- --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked
